name: secret-scan

# Every push and pull request, plus a weekly sweep. History is immutable, but the rule
# set is not: a gitleaks release can start flagging something the previous one missed,
# so a periodic full scan is a real check rather than a formality.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so a compromised or broken upstream release cannot change what CI does.
  # Bump deliberately, in one commit, together with the local install notes.
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
  # Hardcoded rather than downloaded at run time: fetching the artifact and its digest
  # from the same origin only proves they agree with each other.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out with full history
        uses: actions/checkout@v7
        with:
          # A shallow clone would scan one commit and call it a history scan.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -sSfL --retry 3 --retry-all-errors -o "${tarball}" "${url}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}/bin" gitleaks
          chmod 0755 "${RUNNER_TEMP}/bin/gitleaks"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/gitleaks" version

      - name: Scan every commit on every ref
        run: |
          set -euo pipefail
          gitleaks git \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1 \
            --report-format json \
            --report-path "${RUNNER_TEMP}/gitleaks.json" \
            .

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks.json
          if-no-files-found: ignore
